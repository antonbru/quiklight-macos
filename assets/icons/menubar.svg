<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
  <!--
    Мастер-иконка menu bar QuikLight: экран монитора + лампочка.
    Рисуется на сетке 18×18 pt — это ровно один пункт menu bar.
    Template-иконка: только чёрный + прозрачность, macOS перекрашивает
    глиф под светлую/тёмную тему. Не добавлять цвет и полупрозрачные
    градиенты — template использует исключительно альфа-канал.
    Растр: ./scripts/build_icons.sh (rsvg-convert → @1x/@2x/@3x).
  -->
  <g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
    <!-- экран: U-образный контур с загибами наверху -->
    <path d="M3.0 4.5 C1.55 4.9 1.05 5.75 1.05 6.95 L1.05 12.6 C1.05 14.05 1.9 14.75 3.5 14.85 L9 15.05 L14.5 14.85 C16.1 14.75 16.95 14.05 16.95 12.6 L16.95 6.95 C16.95 5.75 16.45 4.9 15.0 4.5" stroke-width="1.1"/>
    <!-- стойка -->
    <path d="M9 15.05 L9 16.4" stroke-width="1.05"/>
    <path d="M7.15 16.8 L10.85 16.8" stroke-width="1.05"/>
    <!-- лампочка -->
    <path d="M6.95 8.15 C6.6 7.35 6.5 6.7 6.5 6.0 C6.5 4.15 7.7 3.0 9 3.0 C10.3 3.0 11.5 4.15 11.5 6.0 C11.5 6.7 11.4 7.35 11.05 8.15" stroke-width="1.05"/>
    <path d="M7.05 8.15 L10.95 8.15" stroke-width="1.05"/>
    <path d="M9 8.6 L9 10.15" stroke-width="1.5"/>
  </g>
  <!-- искры: три точки по бокам лампочки -->
  <g fill="#000">
    <circle cx="4.35" cy="1.75" r="0.72"/>
    <circle cx="3.7" cy="3.45" r="0.74"/>
    <circle cx="4.4" cy="5.15" r="0.72"/>
    <circle cx="13.65" cy="1.75" r="0.72"/>
    <circle cx="14.3" cy="3.45" r="0.74"/>
    <circle cx="13.6" cy="5.15" r="0.72"/>
  </g>
</svg>
